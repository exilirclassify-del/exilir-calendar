const { useState, useEffect, useRef, useCallback } = React;

function getCatColor(k){return CATEGORIES.find(c=>c.key===k)?.color||"#3b82f6";}

function parseAppointment(text){
  var o=text.trim();if(!o)return null;var dateObj=null,timeStr="",title=o;
  var tr=/(\d{1,2}):?(\d{2})?\s*(am|pm|AM|PM)\b|\b(\d{1,2}):(\d{2})\b/g,tm=tr.exec(o);
  if(tm){var h,m;if(tm[4]!==undefined){h=parseInt(tm[4]);m=parseInt(tm[5]);}else{h=parseInt(tm[1]);m=tm[2]?parseInt(tm[2]):0;var ap=tm[3].toLowerCase();if(ap==="pm"&&h!==12)h+=12;if(ap==="am"&&h===12)h=0;}timeStr=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");title=title.replace(tm[0],"").trim();}
  var sd=/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/,dm=sd.exec(title);
  if(dm){var y=parseInt(dm[3]);if(y<100)y+=2000;dateObj=new Date(y,parseInt(dm[1])-1,parseInt(dm[2]));title=title.replace(dm[0],"").trim();}
  if(!dateObj){var mn=Object.keys(MONTHS).join("|"),nd=new RegExp("("+mn+")\\s+(\\d{1,2}),?\\s*(\\d{4})","i");dm=nd.exec(title);if(dm){dateObj=new Date(parseInt(dm[3]),MONTHS[dm[1].toLowerCase()],parseInt(dm[2]));title=title.replace(dm[0],"").trim();}}
  if(!dateObj){var mn2=Object.keys(MONTHS).join("|"),nd2=new RegExp("(\\d{1,2})\\s+("+mn2+"),?\\s*(\\d{4})","i");dm=nd2.exec(title);if(dm){dateObj=new Date(parseInt(dm[3]),MONTHS[dm[2].toLowerCase()],parseInt(dm[1]));title=title.replace(dm[0],"").trim();}}
  if(!dateObj){var lw=title.toLowerCase();if(lw.includes("today")){dateObj=new Date();title=title.replace(/today/i,"").trim();}else if(lw.includes("tomorrow")){dateObj=new Date();dateObj.setDate(dateObj.getDate()+1);title=title.replace(/tomorrow/i,"").trim();}}

  if(!title)title="Appointment";title=title.charAt(0).toUpperCase()+title.slice(1);

  var sk=dateObj?dateObj.getTime()+(timeStr?parseInt(timeStr.split(":")[0])*60+parseInt(timeStr.split(":")[1]):0):0;

}
function countdownLabel(d){if(!d)return"";var n=new Date();n.setHours(0,0,0,0);var x=new Date(d);x.setHours(0,0,0,0);var days=Math.ceil((x-n)/86400000);if(days===0)return"Today";if(days===1)return"Tomorrow";return days+" days away";}

function generateICS(ap){var l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ExilirCalendar//EN"];ap.forEach(function(a){if(!a.dateObj)return;var d=new Date(a.dateObj),p=n=>String(n).padStart(2,"0"),ds=d.getFullYear()+""+p(d.getMonth()+1)+p(d.getDate()),s,e;if(a.timeHour!=null){var h=Math.floor(a.timeHour),m=Math.round((a.timeHour-h)*60);s=ds+"T"+p(h)+p(m)+"00";e=ds+"T"+p(h+1)+p(m)+"00";}else{s=ds;e=ds;}l.push("BEGIN:VEVENT","DTSTART:"+s,"DTEND:"+e,"SUMMARY:"+a.title);if(a.notes)l.push("DESCRIPTION:"+a.notes.replace(/\n/g," "));if(a.category)l.push("CATEGORIES:"+a.category);l.push("UID:"+a.id+"@exilircalendar","END:VEVENT");});l.push("END:VCALENDAR");return l.join("\r\n");}

/* ─── Auth Bar ─── */

        <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
    </div>);

/* ─── Dark Mode Toggle ─── */

/* ─── Timeline ─── */
function TimelineGraph({appointments:ap,t}){
  var wd=ap.filter(a=>a.dateObj);if(wd.length===0)return null;
  var now=new Date();now.setHours(0,0,0,0);
  var up=wd.filter(a=>new Date(a.dateObj)>=now).sort((a,b)=>new Date(a.dateObj)-new Date(b.dateObj)).slice(0,3);
  var sorted=up.length>0?up:wd.sort((a,b)=>new Date(b.dateObj)-new Date(a.dateObj)).slice(0,3);
  var groups={};sorted.forEach(a=>{var d=new Date(a.dateObj),k=d.getFullYear()+"-"+String(d.getMonth()).padStart(2,"0"),lb=d.toLocaleDateString("en-US",{month:"long",year:"numeric"});if(!groups[k])groups[k]={label:lb,items:[]};groups[k].items.push(a);});

    {Object.keys(groups).sort().map(mk=>{var g=groups[mk];return(<div key={mk} style={{marginBottom:24}}><div style={{fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",color:t.textFaint,marginBottom:10}}>{g.label}</div><div style={{display:"flex",gap:10,flexWrap:"wrap"}}>{g.items.map(a=>{var d=new Date(a.dateObj),cl=getCatColor(a.category),cd=countdownLabel(a.dateObj);return(<div key={a.id} style={{flex:"1 1 160px",minWidth:150,background:t.cardAlt,borderRadius:10,padding:"12px 14px",display:"flex",alignItems:"center",gap:12,borderLeft:"4px solid "+cl}}><div style={{display:"flex",flexDirection:"column",alignItems:"center",minWidth:36}}><span style={{fontSize:22,fontWeight:700,lineHeight:1,color:cl}}>{d.getDate()}</span><span style={{fontSize:10,fontWeight:600,textTransform:"uppercase",color:t.textFaint,marginTop:2}}>{d.toLocaleDateString("en-US",{weekday:"short"})}</span></div><div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:600,color:t.textSec,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{a.title}</div><div style={{fontSize:12,color:t.textFaint,marginTop:2}}>{a.time!=="No time"?a.time:"All day"}</div>{cd&&<div style={{fontSize:10,color:"#3b82f6",fontWeight:600,marginTop:2}}>{cd}</div>}</div></div>);})}</div></div>);})}

function AppointmentChart({appointments:ap,t}){

      {pts.map((pt,i)=><line key={i} x1={pt.x} y1={p.top} x2={pt.x} y2={p.top+pH} stroke={t.chartGrid} strokeWidth="0.7" strokeDasharray="6,4"/>)}

  var inp={width:"100%",padding:"12px 14px",fontSize:16,fontFamily:"'DM Sans',sans-serif",border:"2px solid "+t.inputBorder,borderRadius:10,outline:"none",color:t.textSec,background:t.inputBg};
  var sel={...inp,fontSize:14,cursor:"pointer"};
  var edt={...inp,border:"2px solid #3b82f6",background:t.editBg};
  var lbl={fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.05em",color:t.textFaint};
  var thS={textAlign:"left",padding:"10px 16px",fontSize:10,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.06em",color:t.textFaint,background:t.thBg,borderBottom:"1px solid "+t.borderLight};
  var getRows=()=>{var v=filtered.slice(0,3),eiv=v.some(a=>a.id===editingId),ea=!eiv&&editingId?filtered.find(a=>a.id===editingId):null;return ea?v.concat([ea]):v;};

  return(<div style={{minHeight:"100vh",background:t.bg,fontFamily:"'DM Sans',sans-serif",display:"flex",justifyContent:"center",padding:"32px 16px",transition:"background 0.3s"}}>
    <div style={{width:"100%",maxWidth:720}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",gap:14,marginBottom:20}}>
        <div style={{width:48,height:48,borderRadius:14,background:t.iconBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
        <div style={{flex:1}}><h1 style={{fontSize:24,fontWeight:700,color:t.text,letterSpacing:"-0.02em"}}>Exilir Calendar</h1><p style={{fontSize:14,color:t.textFaint,marginTop:2}}>{user?"Synced across your devices":"Your data stays private on your device"}</p></div>
        <DarkModeToggle dark={dark} onToggle={toggleDark}/>
      </div>
      <AuthBar user={user} t={t} onSignIn={handleSignIn} onSignOut={handleSignOut} syncing={syncing}/>
      <ExilirBanner t={t}/>
      {/* Input */}
      <div style={{background:t.card,borderRadius:16,padding:20,boxShadow:t.shadow,marginBottom:24,display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>APPOINTMENT</label><input type="text" value={inputName} onChange={e=>sIN(e.target.value)} onKeyDown={handleKD} placeholder="Dentist, Meeting..." style={inp}/></div></div>
        <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4,position:"relative"}}><label style={lbl}>DATE</label><input type="text" value={inputDate} onChange={e=>sID(e.target.value)} onFocus={()=>sSC(true)} onKeyDown={handleKD} placeholder={todayStr} style={inp} readOnly/>{showCal&&<CalendarPicker value={inputDate} onChange={v=>sID(v)} onClose={()=>sSC(false)} t={t}/>}</div><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>TIME</label><input type="text" value={inputTime} onChange={e=>sIT(e.target.value)} onKeyDown={handleKD} placeholder="5:00pm" style={inp}/></div></div>
        <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>CATEGORY</label><select value={inputCat} onChange={e=>sIC(e.target.value)} style={sel}>{CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}</select></div><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>REMINDER</label><select value={inputReminder} onChange={e=>sIR(e.target.value)} style={sel}>{REMINDERS.map(r=><option key={r.key} value={r.key}>{r.label}</option>)}</select></div></div>
        {showMore&&<div style={{display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>NOTES</label><textarea value={inputNotes} onChange={e=>sINt(e.target.value)} placeholder="Add details..." style={{...inp,fontSize:14,resize:"vertical"}} rows={2}/></div>}
        <div style={{display:"flex",gap:8}}><button onClick={()=>sSM(!showMore)} style={{padding:"12px 16px",fontSize:13,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:t.toggleBg,color:t.textMuted,border:"none",borderRadius:10,cursor:"pointer",whiteSpace:"nowrap"}}>{showMore?"Less":"+ Notes"}</button><button onClick={addAppointment} style={{flex:1,padding:"12px 24px",fontSize:15,fontWeight:600,fontFamily:"'DM Sans',sans-serif",background:"#3b82f6",color:"#fff",border:"none",borderRadius:10,cursor:"pointer"}}>Add</button></div>
        {conflict&&<div style={{background:t.conflictBg,border:"1px solid "+t.conflictBorder,borderRadius:10,padding:"10px 14px",fontSize:13,color:t.conflictText,fontWeight:500}}>{"\u26A0\uFE0F Possible conflict with \""+conflict.title+"\" at "+conflict.time}</div>}
      </div>
      <TimelineGraph appointments={appointments} t={t}/>
      <MonthCalendar appointments={appointments} t={t} onEdit={startEdit} onDelete={removeAppointment}/>
      {/* Search */}
      {appointments.length>0&&<div style={{display:"flex",gap:8,marginBottom:16}}><input type="text" value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search appointments..." style={{...inp,flex:1,background:t.searchBg}}/><select value={filterCat} onChange={e=>setFC(e.target.value)} style={{...sel,flex:"none",width:"auto"}}><option value="all">All categories</option>{CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}</select></div>}
      {/* Table */}
      {filtered.length>0?(<div style={{background:t.card,borderRadius:16,boxShadow:t.shadow,overflow:"hidden"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 20px",borderBottom:"1px solid "+t.borderLight,flexWrap:"wrap",gap:8}}>
          <span style={{fontSize:13,fontWeight:600,color:"#3b82f6",background:t.badgeBg,padding:"4px 12px",borderRadius:20}}>{filtered.length+" appointment"+(filtered.length!==1?"s":"")}</span>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            <button onClick={exportICS} style={{fontSize:12,fontWeight:600,color:"#8b5cf6",background:t.icsBtn,border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"flex",alignItems:"center",gap:4}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>.ics</button>
            <button onClick={exportCSV} style={{fontSize:12,fontWeight:600,color:"#10b981",background:t.csvBtn,border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",display:"flex",alignItems:"center",gap:4}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>CSV</button>
            <button onClick={clearAll} style={{fontSize:12,color:t.textFaint,background:"none",border:"none",cursor:"pointer",fontFamily:"'DM Sans',sans-serif",fontWeight:500}}>Clear all</button>
          </div>
        </div>
        <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr><th style={thS}>Appointment</th><th style={thS}>Date</th><th style={thS}>Time</th><th style={thS}>Info</th><th style={{...thS,textAlign:"center"}}>Actions</th></tr></thead><tbody>
          {getRows().map((appt,i)=>{if(editingId===appt.id)return(<tr key={appt.id} style={{borderBottom:"1px solid "+t.borderLight}}><td colSpan="5" style={{padding:"12px 16px"}}><div style={{display:"flex",flexDirection:"column",gap:10}}>
            <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>APPOINTMENT</label><input type="text" value={editName} onChange={e=>sEN(e.target.value)} onKeyDown={e=>handleEditKD(e,appt.id)} style={edt} autoFocus/></div></div>
            <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4,position:"relative"}}><label style={lbl}>DATE</label><input type="text" value={editDate} onChange={e=>sED(e.target.value)} onFocus={()=>sSEC(true)} onKeyDown={e=>handleEditKD(e,appt.id)} style={edt} readOnly/>{showEditCal&&<CalendarPicker value={editDate} onChange={v=>sED(v)} onClose={()=>sSEC(false)} t={t}/>}</div><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>TIME</label><input type="text" value={editTime} onChange={e=>sET(e.target.value)} onKeyDown={e=>handleEditKD(e,appt.id)} style={edt}/></div></div>
            <div style={{display:"flex",gap:10}}><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>CATEGORY</label><select value={editCat} onChange={e=>sEC(e.target.value)} style={edt}>{CATEGORIES.map(c=><option key={c.key} value={c.key}>{c.label}</option>)}</select></div><div style={{flex:1,display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>REMINDER</label><select value={editReminder} onChange={e=>sER(e.target.value)} style={edt}>{REMINDERS.map(r=><option key={r.key} value={r.key}>{r.label}</option>)}</select></div></div>
            <div style={{display:"flex",flexDirection:"column",gap:4}}><label style={lbl}>NOTES</label><textarea value={editNotes} onChange={e=>sENt(e.target.value)} style={{...edt,resize:"vertical"}} rows={2}/></div>
            <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><button onClick={()=>saveEdit(appt.id)} style={{padding:"8px 16px",fontSize:13,fontWeight:600,fontFamily:"'DM Sans',sans-serif",background:"#3b82f6",color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}}>Save</button><button onClick={cancelEdit} style={{padding:"8px 16px",fontSize:13,fontWeight:500,fontFamily:"'DM Sans',sans-serif",background:t.toggleBg,color:t.textMuted,border:"none",borderRadius:8,cursor:"pointer"}}>Cancel</button></div>
          </div></td></tr>);
          return(<tr key={appt.id} style={{borderBottom:"1px solid "+t.borderLight,animation:flash&&i===0?"slideIn 0.4s ease":"none"}}>
            <td style={{padding:"12px 16px",fontSize:13,color:t.textSec,verticalAlign:"middle"}}><span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:getCatColor(appt.category),marginRight:8,verticalAlign:"middle"}}/>{appt.title}</td>
            <td style={{padding:"12px 16px",fontSize:12,color:t.textMuted,fontFamily:"'JetBrains Mono',monospace",verticalAlign:"middle"}}>{appt.date}</td>
            <td style={{padding:"12px 16px",fontSize:12,color:t.textMuted,fontFamily:"'JetBrains Mono',monospace",verticalAlign:"middle"}}>{appt.time}</td>
            <td style={{padding:"12px 16px",verticalAlign:"middle"}}><div style={{display:"flex",gap:4}}>{appt.notes&&<span title={appt.notes} style={{fontSize:14}}>{"\uD83D\uDCDD"}</span>}{appt.reminder&&appt.reminder!=="none"&&<span title={REMINDERS.find(r=>r.key===appt.reminder)?.label} style={{fontSize:14}}>{"\uD83D\uDD14"}</span>}</div></td>
            <td style={{padding:"12px 16px",textAlign:"center",verticalAlign:"middle"}}><div style={{display:"flex",gap:4,justifyContent:"center"}}>
              <button onClick={()=>startEdit(appt)} style={{background:"none",border:"none",cursor:"pointer",color:t.textGhost,padding:5,borderRadius:6,display:"inline-flex"}} title="Edit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
              <button onClick={()=>removeAppointment(appt.id)} style={{background:"none",border:"none",cursor:"pointer",color:t.textGhost,padding:5,borderRadius:6,display:"inline-flex"}} title="Remove"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div></td></tr>);})}
        </tbody></table></div>
        {filtered.length>3&&<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 20px",borderTop:"1px solid "+t.borderLight}}><span style={{fontSize:13,color:t.textFaint,fontWeight:500}}>{(filtered.length-3)+" more appointment"+(filtered.length-3!==1?"s":"")}</span><button onClick={exportCSV} style={{fontSize:13,fontWeight:600,color:"#3b82f6",background:"none",border:"none",cursor:"pointer",fontFamily:"'DM Sans',sans-serif"}}>{"\u2192 Download CSV for full list"}</button></div>}
      </div>):appointments.length>0?(<div style={{background:t.card,borderRadius:16,padding:"48px 20px",textAlign:"center",boxShadow:t.shadow}}><p style={{fontSize:16,fontWeight:600,color:t.textFaint,marginTop:16}}>No matching appointments</p><p style={{fontSize:14,color:t.textGhost,marginTop:6}}>Try a different search or filter</p></div>):(<div style={{background:t.card,borderRadius:16,padding:"48px 20px",textAlign:"center",boxShadow:t.shadow}}><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke={t.textGhost} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="14" x2="14" y2="14"/></svg><p style={{fontSize:16,fontWeight:600,color:t.textFaint,marginTop:16}}>No appointments yet</p><p style={{fontSize:14,color:t.textGhost,marginTop:6}}>Add one above to get started</p></div>)}
      <AppointmentChart key={appointments.map(a=>a.id).join("-")} appointments={appointments} t={t}/>
      <FeedbackSection user={user} t={t}/>
      {/* Footer */}
      <div style={{textAlign:"center",padding:"32px 0 16px",fontSize:12,color:t.textFaint}}>
        <span>{user?"Your appointments sync securely via your Google account.":"Sign in with Google to sync across all your devices."}</span>
        <div style={{marginTop:8}}><a href="https://exilir.net" target="_blank" rel="noopener noreferrer" style={{color:"#3b82f6",textDecoration:"none",fontWeight:600}}>Exilir LLC</a><span style={{margin:"0 8px"}}>{"\u00B7"}</span><a href="https://exilir.net/classify" target="_blank" rel="noopener noreferrer" style={{color:"#8b5cf6",textDecoration:"none",fontWeight:600}}>Try Exilir Classify</a></div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<CalendarApp/>);
  </script>
</body>
</html>
